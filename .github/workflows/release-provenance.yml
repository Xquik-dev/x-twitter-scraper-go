name: Release Provenance

permissions: {}

concurrency:
  group: release-provenance-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  attest:
    name: Build & Attest Source Archive
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      archive_name: ${{ steps.release.outputs.archive_name }}
      bundle_name: ${{ steps.release.outputs.bundle_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    permissions:
      attestations: write # Required to publish SLSA provenance.
      contents: read
      id-token: write # Required for GitHub keyless signing.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$RELEASE_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "Run this workflow from the matching release tag." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Release tag must contain a valid v-prefixed version." >&2
            exit 1
          fi
          {
            echo "archive_name=x-twitter-scraper-go-$RELEASE_TAG.zip"
            echo "bundle_name=x-twitter-scraper-go-$RELEASE_TAG.sigstore.json"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          cache: false
          go-version-file: ./go.mod

      - name: Verify module integrity
        run: go mod verify

      - name: Run release quality gates
        run: |
          ./scripts/lint
          ./scripts/test
          ./scripts/coverage
          ./scripts/branch-coverage
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Check repository licensing
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Build reproducible source archive
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
        run: ./scripts/reproducible-build "$RUNNER_TEMP/$ARCHIVE_NAME"

      - name: Attest source archive
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/${{ steps.release.outputs.archive_name }}

      - name: Stage attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          BUNDLE_NAME: ${{ steps.release.outputs.bundle_name }}
        run: cp -- "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/$BUNDLE_NAME"

      - name: Preserve attested release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-release-${{ steps.release.outputs.release_tag }}
          path: |
            ${{ runner.temp }}/${{ steps.release.outputs.archive_name }}
            ${{ runner.temp }}/${{ steps.release.outputs.bundle_name }}
          if-no-files-found: error
          retention-days: 1

  attach:
    name: Attach Attested Release Files
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Required to download this run's release artifact.
      contents: write # Required to attach files to the matching release.
    steps:
      - name: Download attested release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-release-${{ needs.attest.outputs.release_tag }}
          path: release-assets

      - name: Attach files to GitHub release
        env:
          ARCHIVE_NAME: ${{ needs.attest.outputs.archive_name }}
          BUNDLE_NAME: ${{ needs.attest.outputs.bundle_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.attest.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release-assets/$ARCHIVE_NAME" \
            "release-assets/$BUNDLE_NAME" \
            --repo "$GITHUB_REPOSITORY"
