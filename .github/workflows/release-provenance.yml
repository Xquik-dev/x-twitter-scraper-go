name: Release Provenance

permissions: {}

concurrency:
  group: release-provenance
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - ".release-please-manifest.json"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact release tag to publish
        required: true
        type: string

jobs:
  prepare:
    name: Prepare Draft Release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # Dispatch the tag-bound publisher.
      contents: write # Create the exact release tag.
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare immutable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(jq -er '."."' .release-please-manifest.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          release_tag="v${version}"
          release_json=""

          for _ in {1..30}; do
            if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" 2>/dev/null)"; then
              break
            fi
            sleep 10
          done

          test -n "$release_json"
          test "$(jq -r '.draft' <<<"$release_json")" = "true"
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$GITHUB_SHA"

          if remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" --jq '.object.sha' 2>/dev/null)"; then
            test "$remote_sha" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${release_tag}" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          gh workflow run release-provenance.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$release_tag" \
            -f release_ref="$release_tag"

  attest:
    name: Build & Attest Source Archive
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      archive_name: ${{ steps.release.outputs.archive_name }}
      bundle_name: ${{ steps.release.outputs.bundle_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    permissions:
      attestations: write # Required to publish SLSA provenance.
      contents: read
      id-token: write # Required for GitHub keyless signing.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != "tag" || "$RELEASE_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "Run this workflow from the matching release tag." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "Release tag must contain a valid v-prefixed version." >&2
            exit 1
          fi
          version="$(jq -er '."."' .release-please-manifest.json)"
          test "$RELEASE_TAG" = "v${version}"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.draft' <<<"$release_json")" = "true"
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          {
            echo "archive_name=x-twitter-scraper-go-$RELEASE_TAG.zip"
            echo "bundle_name=x-twitter-scraper-go-$RELEASE_TAG.sigstore.json"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          cache: false
          go-version-file: ./go.mod

      - name: Verify module integrity
        run: go mod verify

      - name: Run release quality gates
        run: |
          ./scripts/lint
          ./scripts/test
          ./scripts/coverage
          ./scripts/branch-coverage
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Check repository licensing
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Build reproducible source archive
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
        run: ./scripts/reproducible-build "$RUNNER_TEMP/$ARCHIVE_NAME"

      - name: Attest source archive
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/${{ steps.release.outputs.archive_name }}

      - name: Stage attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          BUNDLE_NAME: ${{ steps.release.outputs.bundle_name }}
        run: cp -- "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/$BUNDLE_NAME"

      - name: Preserve attested release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-release-${{ steps.release.outputs.release_tag }}
          path: |
            ${{ runner.temp }}/${{ steps.release.outputs.archive_name }}
            ${{ runner.temp }}/${{ steps.release.outputs.bundle_name }}
          if-no-files-found: error
          retention-days: 1

  attach:
    name: Attach Attested Release Files
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Required to download this run's release artifact.
      contents: write # Required to attach files to the matching release.
    steps:
      - name: Download attested release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-release-${{ needs.attest.outputs.release_tag }}
          path: release-assets

      - name: Attach files to GitHub release
        env:
          ARCHIVE_NAME: ${{ needs.attest.outputs.archive_name }}
          BUNDLE_NAME: ${{ needs.attest.outputs.bundle_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.attest.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "release-assets/$ARCHIVE_NAME" \
            "release-assets/$BUNDLE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest \
            --verify-tag
